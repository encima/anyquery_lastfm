name = "anyquery_lastfm"
version = "0.1.0"
description = "Query Last.fm user listening history and charts through Anyquery"
author = "A fantastic developer"
license = "UNLICENSED"
repository = ""
homepage = ""
type = "anyquery"
minimumAnyqueryVersion = "0.4.0"

tables = ["recent_tracks", "top_artists", "top_tracks", "top_albums"]

# The user configuration schema
[[userConfig]]
name = "api_key"
description = "Your Last.fm API key (get one at https://www.last.fm/api/account/create)"
type = "string"
required = true

[[file]]
platform = "linux/amd64"
directory = "dist/anyquery_linux_amd64_v1"
executablePath = "anyquery_lastfm"

[[file]]
platform = "linux/arm64"
directory = "dist/anyquery_linux_arm64"
executablePath = "anyquery_lastfm"

[[file]]
platform = "darwin/amd64"
directory = "dist/anyquery_darwin_amd64_v1"
executablePath = "anyquery_lastfm"

[[file]]
platform = "darwin/arm64"
directory = "dist/anyquery_darwin_arm64"
executablePath = "anyquery_lastfm"

[[file]]
platform = "windows/amd64"
directory = "dist/anyquery_windows_amd64_v1"
executablePath = "anyquery_lastfm.exe"

[[file]]
platform = "windows/arm64"
directory = "dist/anyquery_windows_arm64"
executablePath = "anyquery_lastfm.exe"
